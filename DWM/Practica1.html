<!DOCTYPE html>
<html lang="es">
<head>
  <title>Practica uno</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  
<div class="container-fluid mt-3">
  <h1>Cuatro columnas responsivas</h1>
  <p>Primera Prueba miau</p>
  <div class="row">
    <div class="col-sm-3 bg-primary text-white">AZUL</div>
    <div class="col-sm-3 bg-dark text-white">NEGRO</div>
    <div class="col-sm-3 bg-success text-white">VERDE</div>
    <div class="col-sm-3 bg-warning text-white">AMARILLO</div>
  </div>
</div>

<div class="container-fluid mt-3">
  <h1>Juego de columnas</h1>
  <p>Segunda Prueba maw</p>
  <div class="row">
    <div class="col-sm-12 bg-primary text-white">AZUL</div>
  </div>
  <div class="row">
    <div class="col-sm-6 bg-primary text-danger">AZUL</div>
    <div class="col-sm-6 bg-danger text-primary">ROJO</div>
  </div>
  <div class="row">
    <div class="col-sm-4 bg-primary text-success">AZUL</div>
    <div class="col-sm-4 bg-danger text-primary">ROJO</div>
    <div class="col-sm-4 bg-success text-danger">VERDE</div>
  </div>
  <div class="row">
    <div class="col-sm-3 bg-primary text-white">AZUL</div>
    <div class="col-sm-3 bg-danger text-white">ROJO</div>
    <div class="col-sm-3 bg-success text-white">VERDE</div>
    <div class="col-sm-3 bg-warning text-white">AMARILLO</div>
  </div>
  <p>Tercera Prueba miw</p>
  <div class="row">
    <div class="col-sm-5 bg-primary text-success">AZUL</div>
    <div class="col-sm-5 bg-danger text-primary">ROJO</div>
    <div class="col-sm-2 bg-success text-danger">VERDE</div>
  </div>
  <div class="row">
    <div class="col-sm-6 bg-primary text-success">AZUL</div>
    <div class="col-sm-4 bg-danger text-primary">ROJO</div>
    <div class="col-sm-2 bg-success text-danger">VERDE</div>
  </div>
  <div class="row">
    <div class="col-sm-4 bg-primary text-danger">AZUL</div>
    <div class="col-sm-8 bg-danger text-primary">ROJO</div>
  </div>
  <div class="row">
    <div class="col-sm-8 bg-primary text-danger">AZUL</div>
    <div class="col-sm-4 bg-danger text-primary">ROJO</div>
  </div>
</div>
</body>
</html>
